name: Crypto Bull Scan

on:
  schedule:
    # breakout:窗口只有突破的那一小時,不每小時跑會抓不到
    - cron: '0 * * * *'
    # early:壓縮盤整的狀態不會一小時就變,每 4 小時足夠
    # 台北 00/04/08/12/16/20 = UTC 16/20/00/04/08/12
    - cron: '30 */4 * * *'
    # 追蹤週報:台北每天 09:15
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: classic / early / breakout / chase / report(只出統計)/ positions(只出持倉)'
        required: false
        default: 'classic'
      args:
        description: '額外參數,例如: --volr 3 --turn 5e6'
        required: false
        default: ''

# 訊號記錄要 commit 回 repo
permissions:
  contents: write

# 每小時的掃描與週報可能撞在一起,排隊避免 push 衝突
concurrency:
  group: scan-bull
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scheduled breakout scan
        if: github.event.schedule == '0 * * * *'
        env: &env
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_bull.py --mode breakout --record signals.jsonl

      # --always:每 4 小時一次,0 檔時也回報,讓你知道系統還活著
      - name: Scheduled early scan
        if: github.event.schedule == '30 */4 * * *'
        env: *env
        run: python scan_bull.py --mode early --always --record signals.jsonl

      # report / positions 是「只查不掃」的分支,交給下面兩步處理
      # (Telegram 的 /stats 與 /pos 分別走那兩條)
      - name: Dispatched scan
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.mode != 'report'
          && github.event.inputs.mode != 'positions'
        env: *env
        run: |
          python scan_bull.py --mode "${{ github.event.inputs.mode }}" \
            --record signals.jsonl ${{ github.event.inputs.args }}

      - name: Dispatched report
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.mode == 'report'
        env: *env
        run: python track.py --telegram

      # /pos:只回報現在手上有什麼、離停損多遠,不做出場判斷也不寫記錄
      - name: Dispatched positions
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.mode == 'positions'
        env: *env
        run: python positions.py --report

      # 出場監控要每輪都跑:停損是有時效的,漏跑一輪就多虧一小時。
      # 沒有標的出場時它不會推播,不會多吵。
      - name: Check exits
        if: >-
          github.event.inputs.mode != 'report'
          && github.event.inputs.mode != 'positions'
        env: *env
        # 每天那班順便附上目前持倉概況,平常只在有出場時才出聲
        run: >-
          python positions.py
          ${{ github.event.schedule == '15 1 * * *' && '--summary' || '' }}

      # 每次都補算報酬;只有每天那班與 /stats 會推播統計
      - name: Update tracking
        if: >-
          github.event.schedule != '15 1 * * *'
          && github.event.inputs.mode != 'report'
          && github.event.inputs.mode != 'positions'
        env: *env
        run: python track.py

      - name: Daily tracking report
        if: github.event.schedule == '15 1 * * *'
        env: *env
        run: python track.py --telegram

      - name: Commit signal log
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add signals.jsonl
          git diff --staged --quiet && echo '無變動' && exit 0
          git commit -m "訊號記錄更新 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push 失敗,第 $i 次重試"; sleep $((2 ** i))
          done
          exit 1
