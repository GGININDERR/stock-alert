name: Crypto Bull Scan

on:
  schedule:
    # breakout:窗口只有突破的那一小時,不每小時跑會抓不到
    - cron: '0 * * * *'
    # early:壓縮盤整的狀態不會一小時就變,每 4 小時足夠
    # 台北 00/04/08/12/16/20 = UTC 16/20/00/04/08/12
    - cron: '30 */4 * * *'
    # 追蹤週報:台北每天 09:15
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: classic / early / breakout / chase / report(只出統計)'
        required: false
        default: 'classic'
      args:
        description: '額外參數,例如: --volr 3 --turn 5e6'
        required: false
        default: ''

# 訊號記錄要 commit 回 repo
permissions:
  contents: write

# 每小時的掃描與週報可能撞在一起,排隊避免 push 衝突
concurrency:
  group: scan-bull
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 排程步驟不看是哪一條 cron 觸發的,改看實際時鐘。
      #
      # 原本用 github.event.schedule == '30 */4 * * *' 來認 early 那班,結果
      # early 幾乎不跑:GitHub 的排程會延遲,04:00 那班常常拖到 04:32 才送達,
      # 而它帶的仍然是 '0 * * * *',於是 early 被跳過;真正的 '30 */4' 那班
      # 則整個被丟掉。實測 2026-08-19 早上三次排程全部 skip 掉 early。
      #
      # 兩條 cron 都留著當備援 —— 誰先送到都算數,由時鐘決定要跑哪些掃描。
      - name: Scheduled breakout scan
        if: github.event_name == 'schedule'
        env: &env
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_bull.py --mode breakout --record signals.jsonl

      # early 也改成每小時跑。原本每 4 小時的理由是「壓縮盤整的狀態不會一
      # 小時就變」,但那說的是「還在壓縮」這件事;early 真正要抓的是「剛
      # 站上箱頂」那一刻(dist_hi24 > -0.5),那是一個瞬間而不是一段狀態。
      # 四小時掃一次,等於最多晚四根 K 棒才看到,不是進場價變差就是整個錯過。
      #
      # 重複推播的疑慮實測不成立:46 筆 early 訊號分佈在 38 檔上,沒有任何
      # 一檔連續重複出現 —— 突破之後箱頂被墊高、帶寬被撐開,條件自己就不
      # 成立了。已經每小時在跑的 breakout 相鄰整點重複率也只有 15%。
      #
      # --always 只留在 UTC 00(台北 08:00)那班當每日心跳,否則一天會收到
      # 24 則「本輪無標的」。
      - name: Scheduled early scan
        if: github.event_name == 'schedule'
        env: *env
        run: |
          h=$(date -u +%H)
          always=''
          [ "$h" = '00' ] && always='--always'
          python scan_bull.py --mode early $always --record signals.jsonl

      # mode=report 時只出統計,不掃描(Telegram 的 /stats 走這條)
      - name: Dispatched scan
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.mode != 'report'
        env: *env
        run: |
          python scan_bull.py --mode "${{ github.event.inputs.mode }}" \
            --record signals.jsonl ${{ github.event.inputs.args }}

      - name: Dispatched report
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.mode == 'report'
        env: *env
        run: python track.py --telegram

      # 出場監控要每輪都跑:停損是有時效的,漏跑一輪就多虧一小時。
      # 沒有標的出場時它不會推播,不會多吵。
      - name: Check exits
        if: github.event.inputs.mode != 'report'
        env: *env
        # 每天那班順便附上目前持倉概況,平常只在有出場時才出聲
        run: >-
          python positions.py
          ${{ github.event.schedule == '15 1 * * *' && '--summary' || '' }}

      # 每次都補算報酬;只有每天那班與 /stats 會推播統計
      - name: Update tracking
        if: >-
          github.event.schedule != '15 1 * * *'
          && github.event.inputs.mode != 'report'
        env: *env
        run: python track.py

      - name: Daily tracking report
        if: github.event.schedule == '15 1 * * *'
        env: *env
        run: python track.py --telegram

      - name: Commit signal log
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add signals.jsonl
          git diff --staged --quiet && echo '無變動' && exit 0
          git commit -m "訊號記錄更新 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push 失敗,第 $i 次重試"; sleep $((2 ** i))
          done
          exit 1
