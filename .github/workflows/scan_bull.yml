name: Crypto Bull Scan

on:
  schedule:
    # breakout:窗口只有突破的那一小時,不每小時跑會抓不到
    - cron: '0 * * * *'
    # early:壓縮盤整的狀態不會一小時就變,每 4 小時足夠
    # 台北 00/04/08/12/16/20 = UTC 16/20/00/04/08/12
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式: classic / early / breakout / chase'
        required: false
        default: 'classic'
      args:
        description: '額外參數,例如: --volr 3 --turn 5e6'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scheduled breakout scan
        if: github.event.schedule == '0 * * * *'
        env: &env
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_bull.py --mode breakout

      # --always:每 4 小時一次,0 檔時也回報,讓你知道系統還活著
      - name: Scheduled early scan
        if: github.event.schedule == '30 */4 * * *'
        env: *env
        run: python scan_bull.py --mode early --always

      - name: Dispatched scan
        if: github.event_name == 'workflow_dispatch'
        env: *env
        run: |
          python scan_bull.py --mode "${{ github.event.inputs.mode }}" \
            ${{ github.event.inputs.args }}
