name: Backtest

on:
  workflow_dispatch:
    inputs:
      args:
        description: >-
          預設一次跑完三種模式 + 量比掃描 + 分期間。
          想單獨跑某一種就填 --mode early;其他參數如 --top 100 --bars 2000
        required: false
        default: '--full --bars 3000'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 一致性檢查(回測與 live 指標必須相同)
        run: python test_backtest.py

      - name: 回測
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest.py --telegram ${{ github.event.inputs.args }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-result
          path: backtest_result.json
